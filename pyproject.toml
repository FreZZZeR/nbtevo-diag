[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nbtevo-diag"
version = "0.2.2"
description = "On-head-unit diagnostics for BMW NBT EVO (F30): module DTCs + live engine/vehicle signals over HSFZ/UDS, no OBD adapter"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Igor Titov" }]
keywords = ["bmw", "nbt-evo", "diagnostics", "dtc", "obd", "hsfz", "uds", "enet", "idrive", "f30", "n57"]
classifiers = [
    # No "License ::" classifier — superseded by the SPDX `license` field above (PEP 639).
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Operating System :: OS Independent",
]
# Transport/UDS come from evocode (same diagnostic plane), on PyPI as `evocode`. The core needs
# only that; the `deploy` extra pulls evocode's `ssh` extra (paramiko) to ship the native app to
# the head unit over its dev SSH. Phase 0 runs from a dev machine over ENET.
dependencies = ["evocode>=0.4"]

[project.optional-dependencies]
# deploy pins >=0.5: the restart path falls back to `evocode reset` (ECUReset 11 01, new in 0.5),
# so the full delivery install must carry it. brings paramiko in via evocode's ssh extra.
deploy = ["evocode[ssh]>=0.5"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/FreZZZeR/nbtevo-diag"
Source = "https://github.com/FreZZZeR/nbtevo-diag"

[project.scripts]
nbtevo-diag = "nbtevo_diag.cli:main"

[tool.setuptools]
packages = ["nbtevo_diag"]
