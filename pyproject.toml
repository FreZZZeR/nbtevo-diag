[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nbtevo-diag"
version = "0.1.0"
description = "On-head-unit diagnostics for BMW NBT EVO (F30): module DTCs + live engine/vehicle signals over HSFZ/UDS, no OBD adapter"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Igor Titov" }]
keywords = ["bmw", "nbt-evo", "diagnostics", "dtc", "obd", "hsfz", "uds", "enet", "idrive", "f30", "n57"]
classifiers = [
    # No "License ::" classifier — superseded by the SPDX `license` field above (PEP 639).
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Operating System :: OS Independent",
]
# Transport/UDS come from evocode (same diagnostic plane), not yet on PyPI — install it
# from its repo first (see README): pip install "evocode @ git+.../evocode.git@v0.4.0".
# Phase 0 runs from a dev machine over ENET; Phase 1 ports the collector + HMI plugin
# to run natively on the head unit.
dependencies = ["evocode>=0.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/FreZZZeR/nbtevo-diag"
Source = "https://github.com/FreZZZeR/nbtevo-diag"

[project.scripts]
nbtevo-diag = "nbtevo_diag.cli:main"

[tool.setuptools]
packages = ["nbtevo_diag"]
