[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nbtevo-diag"
version = "0.0.1"
description = "On-head-unit diagnostics for BMW NBT EVO (F30): module DTCs + live engine/vehicle signals over HSFZ/UDS, no OBD adapter"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Transport/UDS come from evocode (same diagnostic plane). Phase 0 runs from a dev machine over ENET;
# Phase 1 ports the collector + HMI plugin to run natively on the head unit.
dependencies = ["evocode>=0.4"]

[project.scripts]
nbtevo-diag = "nbtevo_diag.cli:main"

[tool.setuptools]
packages = ["nbtevo_diag"]
